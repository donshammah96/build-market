packages:
  - apps/*
  - packages/*
  - workers/*

# `pnpm add` will prefer a version already in the catalog when one exists,
# but still allows adding a dependency outside the catalog (e.g. a package
# used by only one workspace project). Flip to `strict` once every shared
# dependency has been migrated, to make catalog usage mandatory.
catalogMode: strict

allowBuilds:
  "@clerk/shared": true
  "@datadog/native-appsec": true
  "@datadog/native-iast-taint-tracking": true
  "@datadog/native-metrics": true
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  core-js: true
  cypress: true
  esbuild: true
  msgpackr-extract: true
  ngrok: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

auditConfig:
  ignoreGhsas:
    # postcss XSS via unescaped </style> — mitigated: root pnpm.overrides forces
    # postcss@8.5.14 and next>postcss@8.5.14 (patched >=8.5.10) across all workspaces.
    # pnpm audit still flags because it checks manifest ranges, not resolved versions.
    - GHSA-qx2v-qp2m-jg93
    # @hono/node-server middleware bypass — mitigated: root pnpm.overrides forces
    # @hono/node-server@>=2.0.2 (patched >=1.19.13). Only reachable via @prisma/dev
    # which is a dev-time Prisma Studio dep, never in production request paths.
    - GHSA-92pp-h63x-v22m

# Single source of truth for every dependency version shared by 2+ workspace
# projects. Referenced from package.json files via "catalog:", and from the
# overrides below via the same protocol so a version only has to change here.
#
# Versions were chosen to match what pnpm-lock.yaml already resolves today,
# so migrating to catalog: does not change any resolved dependency version.
catalog:
  # --- Core toolchain, shared by every workspace project ---
  typescript: ^7.0.2
  "@typescript/typescript6": ^6.0.2
  eslint: ^9.35.0
  prettier: ^3.9.5
  turbo: ^2.10.10
  vitest: ^4.1.9
  tsx: ^4.20.6
  "@types/node": ^24.8.1

  # --- Next.js / React (client + admin) ---
  # Exact-pinned (no ^) on purpose: mixed Next 16.x minor/patch versions
  # across apps is a common source of build/runtime skew in Vercel monorepos.
  next: 16.2.11
  eslint-config-next: 16.2.11
  "@next/bundle-analyzer": 16.2.11
  "@next/eslint-plugin-next": 16.2.11
  react: ^19.1.0
  react-dom: ^19.1.0
  "@types/react": 19.1.0
  "@types/react-dom": 19.1.1
  next-themes: ^0.4.6
  "@swc/helpers": ^0.5.15

  # --- Styling (client + admin) ---
  tailwindcss: ^4
  "@tailwindcss/postcss": ^4
  tw-animate-css: ^1.4.0
  postcss: 8.5.23
  tailwind-merge: ^3.2.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  lucide-react: ^0.488.0

  # --- Data / validation (client + admin + db) ---
  zod: ^4.3.6
  "@prisma/client": ^7.10.0
  "@prisma/adapter-pg": ^7.10.0
  "@prisma/config": ^7.10.0
  prisma: ^7.10.0
  date-fns: ^4.1.0

  # --- Forms (client + admin) ---
  react-hook-form: ^7.62.0
  "@hookform/resolvers": ^5.2.2

  # --- Data fetching / queues / cache (client + admin + redis) ---
  "@tanstack/react-query": ^5.90.5
  bullmq: ^5.76.8
  pg: 8.18.0
  "@types/pg": 8.18.0
  # Was declared as ^5.4.1 in packages/redis while pnpm.overrides silently
  # forced 5.11.1 everywhere. Catalog value matches the enforced version so
  # the manifest stops lying about what's actually installed.
  ioredis: 5.11.1
  uuid: 11.1.1

  # --- UI feedback / charts (client + admin) ---
  react-toastify: ^11.0.5
  recharts: ^2.15.4

  # --- Auth ---
  "@clerk/nextjs": ^7.3.3
  js-cookie: 3.0.6
  resend: ^6.12.4

  # --- AWS SDK (client + admin) ---
  "@aws-sdk/client-s3": 3.1033.0
  "@aws-sdk/lib-storage": 3.1033.0
  "@aws-sdk/s3-request-presigner": 3.1033.0

  # --- Radix UI primitives shared between client + admin ---
  # Where the two apps previously drifted, the value below is the higher of
  # the two prior ranges (verified to satisfy both original ranges and the
  # version already resolved in pnpm-lock.yaml, so no lockfile churn).
  "@radix-ui/react-avatar": ^1.1.4
  "@radix-ui/react-checkbox": ^1.1.5
  "@radix-ui/react-collapsible": ^1.1.4
  "@radix-ui/react-dialog": ^1.1.15
  "@radix-ui/react-dropdown-menu": ^2.1.16
  "@radix-ui/react-hover-card": ^1.1.8 # was ^1.1.7 in admin, ^1.1.8 in client
  "@radix-ui/react-label": ^2.1.7
  "@radix-ui/react-popover": ^1.1.7
  "@radix-ui/react-progress": ^1.1.6 # was ^1.1.3 in admin, ^1.1.6 in client
  "@radix-ui/react-scroll-area": ^1.2.7 # was ^1.2.4 in admin, ^1.2.7 in client
  "@radix-ui/react-select": ^2.2.6
  "@radix-ui/react-separator": ^1.1.8 # was exact "1.1.8" in client, ^1.1.3 in admin
  "@radix-ui/react-slot": ^1.2.3
  "@radix-ui/react-switch": ^1.2.5
  "@radix-ui/react-tabs": ^1.1.13 # was ^1.1.8 in client, ^1.1.13 in admin
  "@radix-ui/react-tooltip": ^1.2.6 # was ^1.2.0 in admin, ^1.2.6 in client
  "@radix-ui/react-accordion": ^1.2.12
  "@radix-ui/react-alert-dialog": ^1.1.15
  "@radix-ui/react-aspect-ratio": ^1.1.8
  "@radix-ui/react-context-menu": ^2.2.16
  "@radix-ui/react-menubar": ^1.1.16
  "@radix-ui/react-navigation-menu": ^1.2.14
  "@radix-ui/react-radio-group": ^1.3.7
  "@radix-ui/react-slider": ^1.3.5
  "@radix-ui/react-toast": ^1.2.15
  "@radix-ui/react-toggle": ^1.1.9
  "@radix-ui/react-toggle-group": ^1.1.10
  "@stripe/react-stripe-js": ^3.6.0
  "@stripe/stripe-js": ^7.0.0
  "@tailwindcss/forms": ^0.5.10
  "@upstash/redis": ^1.36.2
  autoprefixer: 10.4.20
  blurhash: ^2.0.5
  cmdk: ^1.1.1
  embla-carousel-react: ^8.6.0
  framer-motion: ^12.23.24
  lru-cache: ^11.2.2
  nanoid: ^5.1.16
  postgres: ^3.4.6
  posthog-js: ^1.363.4
  react-day-picker: ^9.14.0
  react-hot-toast: ^2.5.0
  react-intersection-observer: ^9.10.4
  react-resizable-panels: ^2.0.18
  react-select: ^5.9.4
  sharp: ^0.34.3
  socket.io-client: ^4.8.3
  sonner: ^2.0.7
  svix: ^1.92.2
  use-debounce: ^10.0.4
  vaul: ^1.1.2
  zustand: ^5.0.7
  "nats": "^2.19.0"
  "nats.ws": "^1.30.3"
  "@upstash/ratelimit": "^2.0.8"
  "pino": "^9.2.0"

  # --- Testing (client + admin) ---
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.2 # was ^16.3.0 in client, ^16.3.2 in admin
  "@vitejs/plugin-react": ^5.2.0 # was ^5.1.1 in client, ^5.2.0 in admin
  "@types/archiver": ^7.0.0
  archiver: ^7.0.0

  # --- Misc shared ---
  dotenv: 17.4.2
  "@opentelemetry/sdk-metrics": ^1.30.1
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/exporter-metrics-otlp-grpc": ^0.219.0
  "@opentelemetry/exporter-trace-otlp-grpc": ^0.219.0
  "@opentelemetry/instrumentation": ^0.219.0
  "@opentelemetry/instrumentation-http": ^0.44.0
  "@opentelemetry/resources": ^2.8.0
  "@opentelemetry/sdk-node": ^0.219.0
  "@opentelemetry/semantic-conventions": ^1.41.1
  "@opentelemetry/sdk-trace-base": ^0.219.0
  "@opentelemetry/core": 2.8.0
  "@prisma/instrumentation": ^7.10.0
  "@vercel/otel": ^2.1.3
  "wrangler": "^4.90.1"
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/modifiers": ^9.0.0
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  "@heroicons/react": ^2.2.0
  "dd-trace": ^5.50.0

overrides:
  "@typescript-eslint/typescript-estree>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/eslint-plugin>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript-eslint/parser>typescript": "npm:@typescript/typescript6@^6.0.2"
  "typescript-eslint>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@build/eslint-config>typescript": "npm:@typescript/typescript6@^6.0.2"
  "eslint-config-next>typescript": "npm:@typescript/typescript6@^6.0.2"
  "@opentelemetry/core": "2.8.0"
  "bullmq>ioredis": "catalog:"
  "@clerk/shared>js-cookie": "catalog:"
  "@clerk/backend>js-cookie": "catalog:"
  "@clerk/nextjs>js-cookie": "catalog:"
  "@clerk/react>js-cookie": "catalog:"
  ws: ">=8.20.1"
  "engine.io-client>ws": ">=8.20.1"
  "socket.io-client>ws": ">=8.20.1"
  "@hono/node-server": ">=2.0.10"
  "ajv@^6.12.0": "6.14.0"
  postcss: "catalog:"
  valibot: ">=1.4.2"
  "brace-expansion@^2.0.0": "2.1.4"
  defu: ">=6.1.5"
  effect: ">=3.20.0"
  fast-uri: ">=4.1.4"
  "socket.io-parser": ">=4.2.7"
  fast-xml-builder: ">=1.1.7"
  fast-xml-parser: ">=5.7.0"
  "bullmq>uuid": "catalog:"
  hono: ">=4.12.34"
  lodash: ">=4.18.0"
  mailparser: ">=3.9.3"
  "minimatch@^3.0.0": "3.1.5"
  "minimatch@^9.0.0": "9.0.9"
  nodemailer: ">=8.0.5"
  path-to-regexp: ">=8.4.0"
  "picomatch@^2.3.0": "2.3.2"
  "picomatch@^4.0.0": "4.0.4"
  qs: ">=6.14.2"
  "rollup@^4.0.0": "4.60.1"
  "@clerk/express": ">=2.1.6"
  dompurify: ">=3.4.13"
  nanoid: ">=5.1.16"
  "postcss>nanoid": ">=5.1.16"
  axios: ">=1.15.0"
  protobufjs: ">=8.6.6"
  sharp: ">=0.35.0"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  deepmerge-ts: ">=8.0.0"
  browserslist: ">=4.28.7"
  mysql2: ">=3.22.0"
  # NOTE: the previous "admin>next": "16.2.6" entry has been removed. pnpm's
  # `pkgA>pkgB` override selector only matches pkgB when it is a dependency of
  # an installed *npm package* named pkgA — "admin" is a workspace project
  # name, not a package any manifest depends on by that name, so this entry
  # was a silent no-op. The root-level `next: catalog:` override above already
  # forces every workspace project (including admin) onto the same Next
  # version, so no per-app entry is needed.

packageExtensions:
  "@clerk/shared@*":
    dependencies:
      js-cookie: 3.0.6
  "next@*":
    dependencies:
      "@swc/helpers": "^0.5.15"

patchedDependencies:
  uri-js: patches/uri-js.patch
