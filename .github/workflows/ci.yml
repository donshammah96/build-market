                  is_pipeline_path = "pipeline" in self.path or "multi-exec" in self.path

                  if is_pipeline_path:
                      count = 1
                      try:
                          parsed = json.loads(raw) if raw else None
                          if isinstance(parsed, list):
                              count = max(len(parsed), 1)
                      except (json.JSONDecodeError, ValueError):
                          pass
                      body = json.dumps([{"result": None} for _ in range(count)]).encode()
                  else:
                      body = json.dumps({"result": None}).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  self._respond()

              def do_POST(self):
                  self._respond()

              def log_message(self, fmt, *args):
                  pass

          http.server.ThreadingHTTPServer(("127.0.0.1", 8079), UpstashStubHandler).serve_forever()
          ' > /tmp/upstash-rest-stub.log 2>&1 &
          echo $! > /tmp/upstash-rest-stub.pid

          for i in $(seq 1 15); do
            if curl --silent --max-time 1 --output /dev/null http://127.0.0.1:8079/; then
              echo "Upstash REST stub is accepting requests."
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Upstash REST stub failed to start within 15s."
              cat /tmp/upstash-rest-stub.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Cache Next.js build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ${{ github.workspace }}/apps/verification-ops/.next/cache
          key: ${{ runner.os }}-nextjs-verification-ops-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/verification-ops/**/*.{js,jsx,ts,tsx,css}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-verification-ops-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm run db:migrate:deploy

      - name: Build workspace dependencies then verification-ops
        run: pnpm --filter="verification-ops..." run build

      - name: Smoke check root route (fail on 5xx)
        run: |
          set -uo pipefail

          pnpm -C apps/verification-ops run start --hostname 127.0.0.1 --port 3501 > /tmp/verification-ops-preview-smoke.log 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            [ -f /tmp/upstash-rest-stub.pid ] && kill "$(cat /tmp/upstash-rest-stub.pid)" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          PORT_OPEN=""
          PORT_MAX_ATTEMPTS=60
          for i in $(seq 1 "$PORT_MAX_ATTEMPTS"); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Smoke gate failed: verification-ops preview process exited before opening a port."
              cat /tmp/verification-ops-preview-smoke.log || true
              exit 1
            fi

            if (exec 3<>/dev/tcp/127.0.0.1/3501) 2>/dev/null; then
              exec 3>&- 3<&-
              PORT_OPEN=1
              echo "Port 3501 opened after ~$((i * 2))s."
              break
            fi

            if [ $(( i % 10 )) -eq 0 ]; then
              echo "Still waiting for port 3501 to open (attempt $i/$PORT_MAX_ATTEMPTS)..."
            fi
            sleep 2
          done

          if [ -z "$PORT_OPEN" ]; then
            echo "Smoke gate failed: port 3501 never opened after $PORT_MAX_ATTEMPTS attempts (~2 minutes)."
            cat /tmp/verification-ops-preview-smoke.log || true
            exit 1
          fi

          STATUS="000"
          HTTP_MAX_ATTEMPTS=10
          for i in $(seq 1 "$HTTP_MAX_ATTEMPTS"); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Smoke gate failed: verification-ops preview process exited while waiting for a response."
              cat /tmp/verification-ops-preview-smoke.log || true
              exit 1
            fi

            STATUS="$(curl --silent --show-error --max-time 15 --output /tmp/verification-ops-preview-body.txt --write-out "%{http_code}" http://127.0.0.1:3501/ || true)"
            if [ "$STATUS" != "000" ] && [ -n "$STATUS" ]; then
              break
            fi

            echo "Port is open but no HTTP response yet (attempt $i/$HTTP_MAX_ATTEMPTS) — recent app output:"
            tail -n 15 /tmp/verification-ops-preview-smoke.log || true
            sleep 2
          done

          echo "Smoke status: $STATUS"

          if [ -z "$STATUS" ] || [ "$STATUS" = "000" ]; then
            echo "Smoke gate failed: port 3501 opened but never completed an HTTP response"
            echo "after $HTTP_MAX_ATTEMPTS attempts (~50s)."
            cat /tmp/verification-ops-preview-smoke.log || true
            exit 1
          fi

          if [ "${STATUS:0:1}" = "5" ]; then
            echo "Smoke gate failed: root route returned 5xx."
            cat /tmp/verification-ops-preview-smoke.log || true
            cat /tmp/verification-ops-preview-body.txt || true
            exit 1
          fi

          echo "Smoke gate passed: root route returned non-5xx status $STATUS."

  admin-nightly-test-all:
    name: Admin Nightly Test Suite (flake-focused)
    runs-on: ubuntu-latest
    # Nightly/flake-focused suite: `admin:test:all` is the broader,
    # slower admin test run (includes specs that are known-flaky or too
    # slow for the required PR path — see apps/admin/package.json for the
    # script's own scope). It runs on the nightly schedule above, plus
    # on-demand via workflow_dispatch for manual debugging, but never on
    # every push/PR — that keeps it off the required PR critical path
    # while still giving it a daily run and a paper trail when it fails.
    #
    # ASSUMPTION: `admin:test:all` is a Jest/Vitest-style run (like the
    # root `pnpm run test` in the validate job) that exercises the app
    # against a live DB/Redis rather than a built, running Next.js server.
    # If it actually needs a running app (e.g. Playwright against
    # `next start`), add the build + start steps from
    # admin-preview-smoke-gate above before the test step.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: build_market_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d build_market_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZGV2ZWxvcGluZy1jYXRmaXNoLTguY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/build_market_ci
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3005
      CLIENT_APP_URL: http://127.0.0.1:3500
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3005/api
      ENCRYPTION_KEY_V1: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      RATE_LIMIT_BACKEND: memory
      QUEUE_PROVIDER: memory
      # FIX: was https://127.0.0.1:6378 — the pre-fix closed-port approach
      # both smoke-gate jobs' comments document as insufficient, since
      # @upstash/redis retries with backoff and multiple Redis-touching
      # calls stack those retries into a multi-minute hang. Individual test
      # cases can still construct a real Upstash client — the stub removes
      # that failure mode instead of relying on assumptions about what the
      # test suite touches.
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_REST_TOKEN: stub_token_for_ci_only
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # FIX: added — identical stub used by client-preview-smoke-gate and
      # admin-preview-smoke-gate. Must be up before any test that might
      # touch Redis, same reasoning as those jobs.
      - name: Start Upstash REST stub (always-200, no retries triggered)
        run: |
          nohup python3 -c '
          import http.server
          import json

          class UpstashStubHandler(http.server.BaseHTTPRequestHandler):
              def _respond(self):
                  length = int(self.headers.get("Content-Length", 0) or 0)
                  raw = self.rfile.read(length) if length else b""
                  is_pipeline_path = "pipeline" in self.path or "multi-exec" in self.path

                  if is_pipeline_path:
                      count = 1
                      try:
                          parsed = json.loads(raw) if raw else None
                          if isinstance(parsed, list):
                              count = max(len(parsed), 1)
                      except (json.JSONDecodeError, ValueError):
                          pass
                      body = json.dumps([{"result": None} for _ in range(count)]).encode()
                  else:
                      body = json.dumps({"result": None}).encode()

                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  self._respond()

              def do_POST(self):
                  self._respond()

              def log_message(self, fmt, *args):
                  pass

          http.server.ThreadingHTTPServer(("127.0.0.1", 8079), UpstashStubHandler).serve_forever()
          ' > /tmp/upstash-rest-stub.log 2>&1 &
          echo $! > /tmp/upstash-rest-stub.pid

          for i in $(seq 1 15); do
            if curl --silent --max-time 1 --output /dev/null http://127.0.0.1:8079/; then
              echo "Upstash REST stub is accepting requests."
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Upstash REST stub failed to start within 15s."
              cat /tmp/upstash-rest-stub.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm run db:migrate:deploy

      - name: Build shared packages
        # Vitest executes TypeScript source files directly via SWC/Vite transforms,
        # so `admin:test:all` does not require a compiled `next build` (.next output).
        # Building workspace `@build/*` packages provides the compiled entrypoints
        # required for cross-package imports, saving 10–15 cold-cache minutes nightly.
        run: pnpm run build --filter="@build/*"

      - name: Run admin nightly/flake-focused test suite
        run: pnpm run admin:test:all

      # FIX (parity with smoke gates): stop the stub cleanly rather than
      # leaving it as an orphaned background process for the rest of the
      # job's runtime — harmless on a fresh runner, but cheap to be tidy.
      - name: Stop Upstash REST stub
        if: always()
        run: |
          [ -f /tmp/upstash-rest-stub.pid ] && kill "$(cat /tmp/upstash-rest-stub.pid)" >/dev/null 2>&1 || true

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    # `always()` so this job still runs (and can report failure) even when an
    # upstream job in `needs` failed outright — the default implicit
    # condition would skip ci-success entirely in that case, which defeats
    # the point of having one required status check.
    if: always()
    needs:
      - workspace-version-consistency-guard
      - pinned-actions-guard
      - client-changelog-guard
      - admin-changelog-guard
      - verification-ops-changelog-guard
      - validate
      - client-preview-smoke-gate
      - admin-preview-smoke-gate
      - verification-ops-preview-smoke-gate
      - admin-nightly-test-all
    timeout-minutes: 5
    steps:
      - name: Check status of all required jobs
        run: |
          # `needs.*.result` is one of: success, failure, cancelled, skipped.
          # The changelog guards and both smoke gates now run on pull_request
          # AND on push to main/develop/integration/admin-overhaul (see their
          # `if:` conditions above); admin-nightly-test-all only runs on
          # `schedule` / `workflow_dispatch`. Every one of those jobs reports
          # "skipped" rather than "success" on event types it doesn't run
          # for — that's an expected, non-failing outcome here, not a real gap.
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          failed=$(echo "$results" | jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | length
          ')

          if [ "$failed" -gt 0 ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi

          echo "All required jobs passed (or were intentionally skipped)."

    # Point branch protection's required status check at "CI Success" rather
    # than at individual job names. This is the one check name that needs to
    # stay stable as jobs above are renamed, split, or added — every other
    # job name here can change freely without a branch-protection-settings
    # update in lockstep.
