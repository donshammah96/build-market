name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege: lock down the default GITHUB_TOKEN to read-only.
# Individual jobs that need additional scopes declare them explicitly below.
permissions:
  contents: read

env:
  # Must match "engines.node" in the root package.json AND in every
  # apps/*/package.json. Vercel resolves the Node runtime from whichever
  # package.json is closest to a project's configured Root Directory, so if
  # this drifts from an app's own engines.node, CI validates a different
  # runtime than what Vercel actually deploys with.
  NODE_VERSION: "24"
  # Prevent Next.js from making outbound telemetry calls during build steps,
  # which can add latency and produce flaky network errors in CI.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  workspace-version-consistency-guard:
    name: Workspace Version Consistency Guard
    runs-on: ubuntu-latest
    # No install required: this is a pure fs/JSON check against package.json
    # files, so it runs before dependency installation and fails fast if the
    # toolchain versions that Vercel will pick per-project have drifted from
    # the root (and therefore from the committed pnpm-lock.yaml).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify packageManager / engines.node consistency across workspace
        run: node scripts/check-package-manager-consistency.mjs

  client-changelog-guard:
    name: Client Changelog Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # This job only reads PR metadata — no checkout required, no write permissions.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require client changelog update for client code changes
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 },
            );

            const isClientCodeFile = (filename) =>
              filename.startsWith("apps/client/") &&
              !filename.startsWith("apps/client/docs/");

            const clientCodeChanged = files.some((f) => isClientCodeFile(f.filename));
            const changelogUpdated = files.some(
              (f) =>
                f.filename === "apps/client/docs/CHANGELOG.md" &&
                f.status !== "removed",
            );

            if (clientCodeChanged && !changelogUpdated) {
              core.setFailed(
                "apps/client code changed but apps/client/docs/CHANGELOG.md was not updated.",
              );
            } else {
              core.info("Client changelog guard passed.");
            }

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [workspace-version-consistency-guard]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is sourced from the root packageManager field (pnpm@11.x).
        # No explicit version pin needed here — it's already canonical in
        # package.json, and workspace-version-consistency-guard (above) has
        # already confirmed every app/package agrees with that root value.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      # The validate job runs only static checks: lint, type-check, unit tests.
      # None of these require a Next.js build artifact, so there is no .next/cache
      # to restore or populate here. Omitting this cache step avoids writing a
      # cache entry that no step in this job will ever read back.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm run deps:audit

      - name: Build shared packages
        run: pnpm run build --filter="@build/*"

      # Run static checks first for fast feedback — exit before running tests
      # if formatting, lint, or types fail.
      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        # next lint resolves the env boundary at parse time; supply the minimum
        # set of required variables so the env contract passes without a real
        # database or Clerk account.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZGV2ZWxvcGluZy1jYXRmaXNoLTguY2xlcmsuYWNjb3VudHMuZGV2JA==
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/build_market_ci
          NEXT_PUBLIC_APP_URL: http://localhost:3500
          NEXT_PUBLIC_API_URL: http://localhost:3500/api
          ENCRYPTION_KEY_V1: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: pnpm run lint

      - name: Env contract check
        run: pnpm run client:check-env-contract

      - name: Client security drift checks
        run: pnpm run client:check-security-drift

      - name: Client security drift report
        run: pnpm run client:report-security-drift:strict

      - name: Type check
        run: pnpm run check-types

      - name: Test
        run: pnpm run test

  client-preview-smoke-gate:
    name: Client Preview Smoke Gate
    runs-on: ubuntu-latest
    # Gate on validate first: a full Next.js build takes 10–15 minutes.
    # Running it in parallel with validate wastes that time when static checks
    # (lint, type errors, security drift) would have caught the problem in 2–3
    # minutes. On a passing PR the net wall-clock cost is ~5 extra minutes;
    # on a failing PR we save the full build cost every time.
    needs: [validate]
    if: github.event_name == 'pull_request'
    # 25 minutes covers: install (~2 min) + build:client (~10–15 min on cold cache,
    # ~4–6 min warm) + server startup + smoke loop. Keep above the sum of those
    # worst-case segments with a small buffer.
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZGV2ZWxvcGluZy1jYXRmaXNoLTguY2xlcmsuYWNjb3VudHMuZGV2JA==
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
      DATABASE_URL: postgresql://ci:ci@localhost:5432/build_market_ci
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3500
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3500/api
      ENCRYPTION_KEY_V1: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      RATE_LIMIT_BACKEND: memory
      UPSTASH_REDIS_REST_URL: https://stub.upstash.io
      UPSTASH_REDIS_REST_TOKEN: stub_token_for_ci_only
      REDIS_URL: "rediss://:stub_token_for_ci_only@stub.upstash.io:6379"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/apps/client/.next/cache
          # BUG FIX 1: The previous path was `.next/cache` (workspace root).
          # The Next.js app lives in apps/client/, so the root has no .next/
          # directory. That cache step was a complete no-op — it never wrote
          # or restored anything useful.
          #
          # BUG FIX 2: The previous key used `hashFiles('**/package-lock.json')`.
          # This is a pnpm monorepo; there is no package-lock.json. The correct
          # lockfile is pnpm-lock.yaml. The old key would never change on
          # dependency updates, permanently defeating cache invalidation.
          #
          # BUG FIX 3: The previous path list included ~/.npm (npm's cache
          # directory). This is a pnpm project; npm's cache is never populated.
          # The pnpm module store is already cached by `cache: "pnpm"` in
          # setup-node above, so listing ~/.npm here added noise without benefit.
          #
          # Cache key is intentionally scoped to apps/client source files only.
          # Hashing all `**/*.ts(x)` across the entire monorepo means any change
          # to packages/*, apps/admin/*, or services/* invalidates the Next.js
          # build cache even when apps/client was untouched — leading to frequent
          # unnecessary full rebuilds.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/client/**/*.{js,jsx,ts,tsx,css}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies then client
        # The trailing `...` in the filter is load-bearing.
        #
        # `pnpm --filter="apps/client..." run build` means:
        #   "build apps/client AND every local workspace package it depends on,
        #    resolved in topological order (dependencies compiled first)."
        #
        # Without it, @build/resilience (and any other workspace package that
        # emits compiled JS) would not be built before apps/client attempts to
        # import from it, causing the Next.js build to fail on missing module
        # output.
        #
        # This replaces the previous `pnpm -C packages/resilience run build &&
        # pnpm -C apps/client run build` pattern, which was fragile because it
        # hardcoded a single package. Any workspace package that adds a build
        # step in the future is automatically included here without a CI change.
        run: pnpm --filter="client..." run build

      - name: Smoke check root route (fail on 5xx)
        run: |
          set -euo pipefail

          pnpm -C apps/client run start --hostname 127.0.0.1 --port 3500 > /tmp/client-preview-smoke.log 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          STATUS="000"
          for _ in {1..45}; do
            # --max-time 5 bounds each individual attempt to 5 seconds.
            # Without this, a slow-but-alive server could absorb the entire
            # 45-attempt budget with one hung connection, masking startup failures
            # and potentially exhausting the job timeout.
            STATUS="$(curl --silent --show-error --max-time 5 --output /tmp/client-preview-body.txt --write-out "%{http_code}" http://127.0.0.1:3500/ || true)"
            if [ "$STATUS" != "000" ] && [ -n "$STATUS" ]; then
              break
            fi
            sleep 1
          done

          echo "Smoke status: $STATUS"

          if [ -z "$STATUS" ] || [ "$STATUS" = "000" ]; then
            echo "Smoke gate failed: client preview root was unreachable."
            cat /tmp/client-preview-smoke.log || true
            exit 1
          fi

          if [ "${STATUS:0:1}" = "5" ]; then
            echo "Smoke gate failed: root route returned 5xx."
            cat /tmp/client-preview-smoke.log || true
            cat /tmp/client-preview-body.txt || true
            exit 1
          fi

          echo "Smoke gate passed: root route returned non-5xx status $STATUS."
