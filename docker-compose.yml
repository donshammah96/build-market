services:
  postgres:
    image: postgres:16-alpine
    container_name: build-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buildmarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildmarket"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - build-market-net

  redis:
    image: redis:7-alpine
    container_name: build-market-redis
    restart: unless-stopped
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - build-market-net

  nats:
    image: nats:latest
    container_name: build-market-nats
    restart: unless-stopped
    command: -js -m 8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - build-market-net

volumes:
  postgres_data:
  redis_data:
  nats_data:

networks:
  build-market-net:
    driver: bridge
